name: rapidauth

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rapidauth
      POSTGRES_PASSWORD: rapidauth
      POSTGRES_DB: rapidauth
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rapidauth -d rapidauth"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    env_file:
      - path: ../.env
        required: true
    environment:
      DATABASE_URL: postgresql://rapidauth:rapidauth@db:5432/rapidauth?sslmode=disable
      BETTER_AUTH_URL: "http://localhost:${APP_PORT:-3000}"
      HOST: "0.0.0.0"
      DOCKER_DEV_POLLING: "${DOCKER_DEV_POLLING:-true}"
      PRISMA_HIDE_UPDATE_MESSAGE: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
      - "${STUDIO_PORT:-5555}:5555"
    volumes:
      - ..:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next

volumes:
  postgres_data:
  app_node_modules:
  app_next:
