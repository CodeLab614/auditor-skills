version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    ignore:
      # typescript-eslint 8.x does not support TypeScript 6.1 or newer; revisit when support changes.
      - dependency-name: typescript
        versions: [">= 6.1.0"]
      # eslint-plugin-react, included by eslint-config-next, only supports ESLint 9.x.
      - dependency-name: eslint
        versions: [">= 10.0.0"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      bun-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Upgrade Node manually to the next LTS in both Dockerfiles and @types/node.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      docker-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    ignore:
      # Upgrade Node manually to the next LTS in both Dockerfiles and @types/node.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      docker-dev-minor-and-patch:
        update-types:
          - minor
          - patch
